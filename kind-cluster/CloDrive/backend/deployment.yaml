apiVersion: apps/v1
kind: Deployment
metadata:
  name: clodrive-backend
  namespace: clodrive
  labels:
    app: clodrive-backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: clodrive-backend

  template:
    metadata:
      labels:
        app: clodrive-backend

    spec:
      containers:
        - name: backend
          image: setu3011/clodrive-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20