# Horizontal Pod Autoscaler adds or removes the number of pods based on CPU utilization and other metrics. It automatically scales the number of pods.

# Horizontal = increase/decrease the number of pods based on metrics

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clodrive-hpa
  namespace: k8s-draft

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clodrive-deployment

  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70