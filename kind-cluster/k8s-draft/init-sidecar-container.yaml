apiVersion: v1
kind: Pod
metadata:
  name: init-sidecar-container-pod
  namespace: k8s-draft
spec:
  volumes:
    - name: shared-data
      emptyDir: {}

  # =======================================================
  # 1. INIT CONTAINER: Runs first, finishes, and terminates
  # =======================================================
  initContainers:
    - name: init-container
      image: alpine:3.19
      command: ["sh", "-c", "echo 'Hello from Init' > /data/index.html"]
      volumeMounts:
        - name: shared-data
          mountPath: /data

    # ====================================================================
    # 2. SIDECAR CONTAINER: Starts before app, but runs forever (K8s 1.29+)
    # ====================================================================
    - name: logger-sidecar-container
      image: alpine:3.19
      restartPolicy: Always  # <-- This makes it a continuous Sidecar
      command: ["sh", "-c", "while true; do echo 'Sidecar checking...'; sleep 10; done"]

  # =======================================================
  # 3. MAIN CONTAINER: Starts last and runs the actual app
  # =======================================================
  containers:
    - name: main-app-container
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
