# Vertical = increase/decrease the resource size of the pods based on the metrics

apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

metadata:
  name: clodrive-vpa

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clodrive-deployment

  updatePolicy:
    updateMode: "Auto"

  resourcePolicy:
    containerPolicies:
      - containerName: clodrive-container

        minAllowed:
          cpu: "100m"
          memory: "128Mi"

        maxAllowed:
          cpu: "2"
          memory: "2Gi"