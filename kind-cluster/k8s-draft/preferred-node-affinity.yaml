# the scheduler prefers matching nodes but can use another suitable node if necessary.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: preferred-affinity-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: preferred-demo

  template:
    metadata:
      labels:
        app: preferred-demo

    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              preference:
                matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - high-memory
      containers:
        - name: nginx
          image: nginx:latest