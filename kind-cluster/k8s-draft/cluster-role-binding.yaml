# ClusterRoleBinding connects a ClusterRole to a user, group, or service account, granting them the permissions defined in the ClusterRole across the entire cluster.

# Cluster Role defines what permissions are allowed.
# ClusterRoleBinding assigns those permissions to users, groups, or service accounts.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-reader-binding
subjects:
  - kind: ServiceAccount
    name: my-service-account
    namespace: default

roleRef:
  kind: ClusterRole
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io